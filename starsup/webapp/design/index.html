<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>StarsUp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<meta name="theme-color" content="#05070f">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="who"><div class="ava" id="ava">S</div><div><div class="hi" id="hi">StarsUp</div><div class="sub">Stars, Premium, подарки</div></div></div>
  <div class="top-actions">
    <button class="chip gold" data-act="goto" data-tab="topup" id="balChip">0 сум</button>
    <button class="chip" data-act="support" aria-label="Поддержка">🛟 Поддержка</button>
  </div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-act="goto" data-tab="shop" class="on"><i><svg viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></i>Магазин</button>
  <button data-act="goto" data-tab="topup"><i><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg></i>Пополнить</button>
  <button data-act="goto" data-tab="profile"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg></i>Профиль</button>
</nav>
<div class="backdrop" id="backdrop" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
