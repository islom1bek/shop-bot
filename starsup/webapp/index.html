<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>StarsUp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="who"><div class="ava" id="ava">S</div><div><div class="hi" id="hi">StarsUp</div><div class="sub">Stars, Premium, подарки</div></div></div>
  <div class="top-actions">
    <button class="chip gold" data-act="goto" data-tab="topup" id="balChip">0 сум</button>
    <button class="chip" data-act="support" aria-label="Поддержка">🛟 Поддержка</button>
  </div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-act="goto" data-tab="shop" class="on"><i>🛍</i>Магазин</button>
  <button data-act="goto" data-tab="topup"><i>💳</i>Пополнить</button>
  <button data-act="goto" data-tab="profile"><i>👤</i>Профиль</button>
</nav>
<div class="backdrop" id="backdrop" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
